<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Portfolio | Chicken & CO</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .hero { height: 60vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(to bottom, rgba(0,0,0,0.1), #0b0b0b), url('https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1200&q=80'); background-size: cover; text-align: center; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; padding: 50px; }
        .card { background: #1a1a1a; border-radius: 20px; overflow: hidden; border: 1px solid #333; transition: 0.4s; }
        .card:hover { transform: scale(1.05); border-color: #fbc02d; }
        .card-img { height: 250px; background: #333; width: 100%; object-fit: cover; }
        .card-content { padding: 25px; }
        .price-tag { color: #fbc02d; font-size: 1.5rem; font-weight: bold; }
        .order-btn { background: #fbc02d; color: #000; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .bank-details { display: none; background: #222; padding: 20px; border-radius: 10px; margin-top: 20px; border-left: 4px solid #fbc02d; }
    </style>
</head>
<body>
    <div class="hero">
        <div>
            <h1 style="font-size: 3.5rem; margin: 0;">Chicken & CO.</h1>
            <p style="letter-spacing: 3px; color: #888;">SAGAMU'S FINEST EATERY</p>
        </div>
    </div>

    <div class="portfolio-grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=500&q=80" class="card-img">
            <div class="card-content">
                <h3>Creamy Yogurt Parfait</h3>
                <p>A portfolio of flavors in every spoonful.</p>
                <div class="price-tag">₦3,500</div>
                <button class="order-btn" onclick="showPay()">GET THIS MEAL</button>
                <div id="pay-box" class="bank-details">
                    <p>Bank: Access Bank</p>
                    <p>Acc: 0123456789</p>
                    <button class="order-btn" style="background:#25d366" onclick="location.href='https://wa.me/2348102780392'">Confirm on WhatsApp</button>
                </div>
            </div>
        </div>
    </div>
    <script>function showPay(){document.getElementById('pay-box').style.display='block';}</script>
</body>
</html>
